<!-- GarageVehicleRow — ForEach child template for vehicle list -->
<button data-dz="button"
    data-name="vehicleRowBtn"
    data-style="TXListRow"
    data-on-click="OnVehicleSelected"
    class="dz-xy-0-0 dz-wh-100-48px dz-tc-FE">

  <div data-dz="panel"
      data-name="vehicleRowContent"
      data-style="blank"
      class="dz-xy-0-0 dz-wh-full dz-align-cc dz-c-FE dz-noptr">

    <!-- Health Indicator (colored bar on left) -->
    <div data-dz="panel"
        data-name="healthIndicator"
        data-style="rover_sim_colorable"
        data-bind-color="{{ GetHealthColor() }}"
        class="dz-xy-0-10 dz-wh-1-80 dz-c-6A9A6A dz-noptr"></div>

    <!-- Vehicle Name -->
    <span data-dz="text"
        data-name="vehicleName"
        data-bind="{{ _inputVehicle.VehicleName }}"
        class="dz-xy-4-0 dz-wh-65-60 dz-tc-C0C0C0 dz-font-14 dz-noptr dz-exact-text dz-text-left dz-text-vc">
      OffroadHatchback
    </span>

    <!-- Health Level Text -->
    <span data-dz="text"
        data-name="vehicleHealth"
        data-bind="{{ GetHealthText() }}"
        class="dz-xy-4-55 dz-wh-65-40 dz-tc-555555 dz-font-14 dz-noptr dz-exact-text dz-text-left dz-text-vc">
      Pristine
    </span>

    <!-- Parked-at-spot indicator (red = blocking parking) -->
    <div data-dz="panel"
        data-name="blockingBadge"
        data-style="TXBadge"
        class="dz-xy-75-20 dz-wh-22-60 dz-c-FE dz-noptr dz-hidden">
      <span data-dz="text"
          data-name="blockingText"
          class="dz-xy-0-0 dz-wh-100-100 dz-tc-C9302C dz-font-14 dz-noptr dz-exact-text dz-text-center dz-text-vc">
        IN SPOT
      </span>
    </div>
  </div>
</button>
